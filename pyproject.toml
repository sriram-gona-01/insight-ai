[project]
name = "insight-ai"
version = "0.1.0"
description = "Self-hosted question answering over slide decks and PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
insight = "insight.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "reportlab>=5.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/insight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: needs Postgres or real models"]
